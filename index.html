<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Conditionals Practice</title>
<link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F4F1EA; /* Soft beige paper texture color */
            font-family: 'Inter', sans-serif;
            color: #374151;
            margin: 0;
            padding: 0;
        }
        
        .paper-container {
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 4px 6px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .font-cursive {
            font-family: 'Caveat', cursive;
        }

        /* Elegant Inputs */
        .blank-input {
            border: none;
            border-bottom: 1.5px solid #D1D5DB;
            background: transparent;
            border-radius: 0;
            transition: all 0.3s ease;
            padding: 0 8px 4px 8px;
            margin: 0 4px;
            color: #1F2937;
            min-width: 80px;
        }

        .blank-input:focus {
            border-bottom-color: #6366F1; /* Elegant indigo focus */
            outline: none;
        }
        
        /* State Classes */
        .input-correct {
            border-bottom-color: #10B981 !important; 
            color: #10B981 !important;
        }
        
        .input-incorrect {
            border-bottom-color: #EF4444 !important;
            color: #EF4444 !important;
        }

        /* Disabled state for correct answers */
        .blank-input:disabled {
            background-color: transparent;
            opacity: 1; /* override default dimming */
            cursor: default;
        }

        /* Premium Card Hover Effects */
        .premium-card {
            background: #FFFFFF;
            border: 1px solid #F3F4F6;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.08), 0 10px 15px -5px rgba(0, 0, 0, 0.04);
            border-color: #E5E7EB;
        }

        /* Primary Button */
        .btn-primary {
            background-color: #111827;
            color: #FFFFFF;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
            background-color: #1F2937;
        }

        .hint-btn {
            transition: all 0.2s ease;
        }
        
        .hint-btn:hover {
            color: #6366F1;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- Premium Canvas -->
    <div class="paper-container w-full max-w-4xl p-8 md:p-14 min-h-[85vh] flex flex-col">
        <div class="w-full">
            
            <!-- Home View -->
            <div id="home-view" class="block animate-fade-in">
                <header class="text-center mb-14 mt-4">
                    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-5 font-serif tracking-tight">Conditionals Practice</h1>
                    <p class="text-gray-500 max-w-xl mx-auto font-light text-lg">Master your English grammar. Select a module below to begin refining your conditionals.</p>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
                    <button onclick="loadExercise('ex1')" class="premium-card flex flex-col items-start justify-center p-8 rounded-xl text-left">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-500 mb-2">Exercise 1</span>
                        <span class="text-2xl font-semibold text-gray-800 font-serif mb-1">Zero & First</span>
                        <span class="text-sm text-gray-500 font-light mt-2">Present truths and likely future situations.</span>
                    </button>
                    
                    <button onclick="loadExercise('ex2')" class="premium-card flex flex-col items-start justify-center p-8 rounded-xl text-left">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-500 mb-2">Exercise 2</span>
                        <span class="text-2xl font-semibold text-gray-800 font-serif mb-1">Second & Third</span>
                        <span class="text-sm text-gray-500 font-light mt-2">Unreal present and hypothetical past scenarios.</span>
                    </button>

                    <button onclick="loadExercise('ex3')" class="premium-card flex flex-col items-start justify-center p-8 rounded-xl text-left">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-500 mb-2">Exercise 3</span>
                        <span class="text-2xl font-semibold text-gray-800 font-serif mb-1">Mixed (0 - 3)</span>
                        <span class="text-sm text-gray-500 font-light mt-2">A comprehensive mix of all conditional types.</span>
                    </button>

                    <button onclick="loadExercise('ex4')" class="premium-card flex flex-col items-start justify-center p-8 rounded-xl text-left">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-500 mb-2">Exercise 4</span>
                        <span class="text-2xl font-semibold text-gray-800 font-serif mb-1">Mixed (0 - 3)</span>
                        <span class="text-sm text-gray-500 font-light mt-2">Advanced practice combining all forms.</span>
                    </button>
                </div>
            </div>

            <!-- Exercise View -->
            <div id="exercise-view" class="hidden">
                <button onclick="showHome()" class="mb-8 flex items-center text-gray-400 hover:text-gray-800 transition-colors font-medium text-sm tracking-wide">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    RETURN HOME
                </button>

                <h2 id="exercise-title" class="text-3xl md:text-4xl font-bold text-gray-900 mb-10 font-serif tracking-tight"></h2>

                <div id="sentences-container" class="space-y-10 mb-12">
                    <!-- Sentences will be injected here -->
                </div>

                <div class="flex justify-center mt-16 mb-6">
                    <button onclick="checkAnswers()" class="btn-primary font-medium py-3 px-10 rounded-full tracking-wide">
                        Check Answers
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Database of exercises based on user requirements
        const exerciseData = {
            ex1: {
                title: "Exercise 1: Zero & First Conditionals",
                sentences: [
                    { text: "If you ~heat~ |heat| ice, it ~melt~ |melts|.", hint: "Zero conditional - Present Simple / Present Simple" },
                    { text: "If it ~rain~ |rains| tomorrow, we ~not go~ |will not go/won't go| to the park.", hint: "First conditional - use 'will not go'" },
                    { text: "If I ~have~ |have| enough money, I ~buy~ |will buy/'ll buy| some new shoes.", hint: "First conditional - Present / Future" },
                    { text: "Water ~boil~ |boils| if you ~heat~ |heat| it to 100 degrees.", hint: "Zero conditional fact" },
                    { text: "She ~be~ |will be/'ll be| late if the train ~be~ |is| delayed.", hint: "First conditional" },
                    { text: "If you ~mix~ |mix| red and blue, you ~get~ |get| purple.", hint: "Zero conditional fact" },
                    { text: "If he ~study~ |studies| hard, he ~pass~ |will pass/'ll pass| the exam.", hint: "First conditional" },
                    { text: "Plants ~die~ |die| if they ~not get~ |do not get/don't get| enough water.", hint: "Zero conditional fact - use 'do not get'" }
                ]
            },
            ex2: {
                title: "Exercise 2: Second & Third Conditionals",
                sentences: [
                    { text: "If I ~be~ |were| you, I ~get~ |would get/'d get| a new job.", hint: "Second conditional - use 'were'" },
                    { text: "If we ~arrive~ |had arrived/'d arrived| earlier, we ~see~ |would have seen/'d have seen/would've seen| John.", hint: "Third conditional" },
                    { text: "If they ~have~ |had| enough money, they ~buy~ |would buy/'d buy| a house.", hint: "Second conditional" },
                    { text: "She ~pass~ |would have passed/'d have passed/would've passed| the exam if she ~study~ |had studied/'d studied| harder.", hint: "Third conditional" },
                    { text: "If I ~know~ |had known/'d known| you were coming, I ~bake~ |would have baked/'d have baked/would've baked| a cake.", hint: "Third conditional" },
                    { text: "I ~travel~ |would travel/'d travel| around the world if I ~win~ |won| the lottery.", hint: "Second conditional" },
                    { text: "If he ~be~ |were| taller, he ~play~ |would play/'d play| basketball.", hint: "Second conditional - use 'were'" },
                    { text: "They ~not miss~ |would not have missed/wouldn't have missed| the flight if they ~wake up~ |had woken up/'d woken up| on time.", hint: "Third conditional - use 'would not have missed'" }
                ]
            },
            ex3: {
                title: "Exercise 3: Mixed Conditionals 0-3",
                sentences: [
                    { text: "If she ~go~ |had gone/'d gone| to university, she ~study~ |would have studied/'d have studied/would've studied| French.", hint: "Third conditional" },
                    { text: "If it ~rain~ |rains| a lot, plants ~grow~ |grow| very fast.", hint: "Zero conditional" },
                    { text: "If I ~have~ |had| a lot of money, I ~travel~ |would travel/'d travel| the world.", hint: "Second conditional" },
                    { text: "If she ~call~ |calls| me, I ~tell~ |will tell/'ll tell| her the news.", hint: "First conditional" },
                    { text: "If we ~not miss~ |had not missed/hadn't missed| the bus, we ~be~ |would have been/'d have been/would've been| on time.", hint: "Third conditional - use 'had not missed'" },
                    { text: "If you ~freeze~ |freeze| water, it ~become~ |becomes| solid.", hint: "Zero conditional" },
                    { text: "If I ~be~ |were| a bird, I ~fly~ |would fly/'d fly| everywhere.", hint: "Second conditional - use 'were'" },
                    { text: "They ~cancel~ |will cancel/'ll cancel| the match if it ~snow~ |snows| tomorrow.", hint: "First conditional" },
                    { text: "If he ~drive~ |had driven/'d driven| more carefully, he ~not crash~ |would not have crashed/wouldn't have crashed|.", hint: "Third conditional - use 'would not have crashed'" },
                    { text: "Ice ~melt~ |melts| if you ~leave~ |leave| it in the sun.", hint: "Zero conditional" },
                    { text: "If you ~eat~ |eat| all that cake, you ~feel~ |will feel/'ll feel| sick.", hint: "First conditional" },
                    { text: "I ~buy~ |would buy/'d buy| that car if it ~be~ |were| cheaper.", hint: "Second conditional - use 'were'" }
                ]
            },
            ex4: {
                title: "Exercise 4: Mixed Conditionals 0-3",
                sentences: [
                    { text: "If they ~invite~ |invite| me, I ~go~ |will go/'ll go| to the party.", hint: "First conditional" },
                    { text: "If you ~not eat~ |had not eaten/hadn't eaten| so much, you ~not feel~ |would not have felt/wouldn't have felt| sick.", hint: "Third conditional - use 'had not eaten' and 'would not have felt'" },
                    { text: "If babies ~be~ |are| hungry, they ~cry~ |cry|.", hint: "Zero conditional" },
                    { text: "If he ~study~ |studies| harder, he ~pass~ |will pass/'ll pass| his exams next week.", hint: "First conditional" },
                    { text: "We ~stay~ |would have stayed/'d have stayed| longer if we ~have~ |had had/'d had| more time.", hint: "Third conditional" },
                    { text: "If people ~eat~ |eat| too much, they ~get~ |get| fat.", hint: "Zero conditional" },
                    { text: "If I ~speak~ |spoke| perfect English, I ~have~ |would have/'d have| a good job.", hint: "Second conditional" },
                    { text: "She ~be~ |will be/'ll be| thrilled if she ~win~ |wins| the competition.", hint: "First conditional" },
                    { text: "If the weather ~be~ |were| nice, we ~go~ |would go/'d go| to the beach.", hint: "Second conditional - use 'were'" },
                    { text: "You ~get~ |get| water if you ~mix~ |mix| hydrogen and oxygen.", hint: "Zero conditional" },
                    { text: "If I ~see~ |had seen/'d seen| him, I ~say~ |would have said/'d have said/would've said| hello.", hint: "Third conditional" },
                    { text: "If I ~know~ |knew| his number, I ~call~ |would call/'d call| him.", hint: "Second conditional" }
                ]
            }
        };

        const homeView = document.getElementById('home-view');
        const exerciseView = document.getElementById('exercise-view');
        const titleEl = document.getElementById('exercise-title');
        const containerEl = document.getElementById('sentences-container');

        // Functions
        function showHome() {
            exerciseView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        function loadExercise(exerciseId) {
            const data = exerciseData[exerciseId];
            if (!data) return;

            titleEl.textContent = data.title;
            containerEl.innerHTML = ''; // Clear previous

            data.sentences.forEach((sentence, index) => {
                const sentenceHtml = buildSentenceHtml(sentence.text, sentence.hint, index);
                containerEl.insertAdjacentHTML('beforeend', sentenceHtml);
            });

            attachListeners();

            homeView.classList.add('hidden');
            exerciseView.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function buildSentenceHtml(text, hint, index) {
            // Regex to match the answers inside | |
            const parts = text.split(/\|([^|]+)\|/);
            
            let html = `<div class="relative group">`;
            html += `<p class="sentence-text text-lg md:text-xl leading-loose text-gray-800 flex flex-wrap items-center">`;
            html += `<span class="font-semibold text-gray-400 mr-3 text-base">${index + 1}.</span>`;

            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    // Regular text with base verb substitution
                    let textPart = parts[i].replace(/~([^~]+)~/g, '<span class="font-cursive text-indigo-700/80 mx-1 text-2xl font-semibold whitespace-nowrap">($1)</span>');
                    html += `<span>${textPart}</span>`;
                } else {
                    // Calculate a rough width based on the longest acceptable answer
                    const answers = parts[i].split('/');
                    const longestLength = Math.max(...answers.map(a => a.length));
                    const widthCalc = Math.max(80, longestLength * 12) + 'px'; 
                    
                    html += `<input type="text" data-answers="${parts[i]}" autocomplete="off" autocorrect="off" spellcheck="false" style="width: ${widthCalc}" class="blank-input font-sans text-center font-medium mx-1 placeholder-gray-300">`;
                }
            }
            
            // Sleek hint button (SVG icon)
            html += `<button type="button" class="hint-btn ml-3 text-gray-300 focus:outline-none" title="Show Hint">
                        <svg class="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                     </button>`;
            html += `</p>`;
            
            // Subtle hint text dropdown
            html += `<div class="hint-text hidden mt-3 text-sm text-indigo-600 bg-indigo-50/50 p-4 rounded-lg border border-indigo-100 font-sans shadow-sm transition-all">
                        <span class="font-semibold mr-1">Hint:</span> ${hint}
                     </div>`;
            html += `</div>`;
            
            return html;
        }

        function attachListeners() {
            // Hint toggle logic
            document.querySelectorAll('.hint-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const hintDiv = e.target.closest('div').querySelector('.hint-text');
                    hintDiv.classList.toggle('hidden');
                });
            });

            // Remove error color formatting when user starts typing again
            document.querySelectorAll('.blank-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    if(!e.target.disabled) {
                        e.target.classList.remove('input-incorrect');
                    }
                });
            });
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('#exercise-view .blank-input');
            
            inputs.forEach(input => {
                // If already marked correct and locked, skip it
                if (input.disabled) return;

                const rawAnswers = input.dataset.answers.split('/');
                const correctAnswers = rawAnswers.map(a => a.toLowerCase().trim());
                
                // Normalize user input: lowercase, remove multi-spaces, trim
                let userVal = input.value.toLowerCase().trim().replace(/\s+/g, ' ');

                input.classList.remove('input-incorrect');

                if (userVal === '') {
                    // Empty is considered incorrect visually but we'll mark it red
                    input.classList.add('input-incorrect');
                } else if (correctAnswers.includes(userVal)) {
                    input.classList.add('input-correct');
                    input.disabled = true; // Lock the correct answer
                } else {
                    input.classList.add('input-incorrect');
                    // We DO NOT clear input.value, allowing the user to edit it.
                }
            });
        }
    </script>
</body>
</html>
